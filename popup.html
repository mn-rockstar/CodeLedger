<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeLedger</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 340px;
        margin: 0;
        padding: 14px;
        background: linear-gradient(
          160deg,
          var(--plane-top) 0%,
          var(--plane-bottom) 100%
        );
        color: var(--ink-primary);
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand img {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        display: block;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }

      /* .card itself lives in theme.css — shared with the welcome page. */
      .card {
        padding: 14px;
        margin-bottom: 10px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: var(--ink-secondary);
      }
      input {
        width: 100%;
        padding: 8px 9px;
        margin-bottom: 9px;
        font-size: 12px;
        font-family: inherit;
        background: var(--card);
        color: var(--ink-primary);
        border: 1px solid var(--hairline);
        border-radius: 9px;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        background: var(--card);
        color: var(--ink-primary);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        box-shadow: var(--card-inner);
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #ffffff;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin-bottom: 9px;
      }
      .muted {
        color: var(--ink-secondary);
        font-size: 12px;
      }
      .hint {
        color: var(--ink-muted);
        font-size: 11px;
        margin: -4px 0 9px;
      }
      .row {
        display: flex;
        gap: 7px;
      }
      code {
        font-size: 11px;
        background: var(--hairline);
        border-radius: 4px;
        padding: 1px 4px;
      }

      /* Donut + hero figure */
      .chart {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 2px auto 14px;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hero {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .hero-value {
        font-size: 46px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .hero-label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-top: 5px;
      }

      /* Legend doubles as the value table — every count is readable as text,
         so nothing is gated behind color or hover. */
      .legend {
        display: grid;
        gap: 7px;
        font-size: 12px;
      }
      .legend-row {
        display: grid;
        grid-template-columns: 9px 1fr auto auto;
        align-items: center;
        gap: 9px;
      }
      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 3px;
      }
      .legend-name {
        color: var(--ink-secondary);
      }
      .legend-value {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .legend-pct {
        font-variant-numeric: tabular-nums;
        color: var(--ink-muted);
        min-width: 36px;
        text-align: right;
      }

      /* KPI tiles */
      .kpis {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .kpi {
        background: var(--card);
        backdrop-filter: blur(12px) saturate(1.4);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        box-shadow: var(--card-shadow), var(--card-inner);
        padding: 10px 12px;
        min-width: 0;
      }
      .kpi-value {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kpi-value.small {
        font-size: 13px;
        line-height: 1.5;
        padding-top: 3px;
      }
      .kpi-label {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-top: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Identity block: GitHub / LeetCode / repo */
      .identity dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px 12px;
        font-size: 12px;
        align-items: baseline;
      }
      .identity dt {
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .identity dd {
        margin: 0;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .identity .pending {
        color: var(--ink-muted);
        font-style: italic;
      }

      .empty {
        text-align: center;
        color: var(--ink-muted);
        font-size: 12px;
        padding: 20px 0 24px;
      }
      .footer .muted {
        margin: 0 0 9px;
      }
      .linkish {
        background: none;
        border: none;
        box-shadow: none;
        color: var(--ink-muted);
        font-size: 11px;
        width: auto;
        padding: 2px 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .linkish:hover {
        color: var(--danger);
        border: none;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="brand">
        <img src="icons/icon-48.png" alt="" />
        <h1>
          <span class="wordmark-code">Code</span
          ><span class="wordmark-ledger">Ledger</span>
        </h1>
      </div>
      <span class="badge" id="badge"></span>
    </div>
    <div id="app">Loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
